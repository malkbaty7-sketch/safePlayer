name: Android build
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest bundleRelease 2>&1 | tee gradle-build.log
      - name: Annotate build failures
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            grep -E '^e: |^e:|error:| FAILED|What went wrong|Exception:|failed:' gradle-build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
      - name: Prepare installable test APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safeplayer-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/safeplayer-apk/SafePlayer-debug.apk"
          cd "$RUNNER_TEMP/safeplayer-apk"
          sha256sum SafePlayer-debug.apk > SHA256SUMS.txt
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: SafePlayer-installable-debug-APK
          path: ${{ runner.temp }}/safeplayer-apk/
          if-no-files-found: error
          retention-days: 30
      - name: Add APK download to job summary
        run: |
          echo '### SafePlayer test APK' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download APK artifact (ZIP)](${{ steps.apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract SafePlayer-debug.apk from the ZIP. Debug builds are for testing, not store release.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SafePlayer-release-unsigned
          path: app/build/outputs/bundle/release/*.aab
  device-tests:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest
      - name: Annotate device test failures
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -type f -exec grep -H -A 15 -E '<failure|<error' {} + | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
