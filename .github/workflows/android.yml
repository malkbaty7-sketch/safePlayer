name: Android build
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest 2>&1 | tee gradle-build.log
      - name: Annotate build failures
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            grep -E '^e: |^e:|error:| FAILED|What went wrong|Exception:|failed:' gradle-build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SafePlayer-debug
          path: app/build/outputs/apk/debug/*.apk
